<meta charset="utf-8">
<title>Van Interior</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f6f3ec;
    --stage: #ece7dc;
    --ink: #22221f;
    --muted: #7d7a70;
    --rule: #ddd6c8;
    --panel: #fffdf8;
    --brass: #a8762b;
    --shadow: 0 1px 2px rgba(40,34,20,.07), 0 8px 24px rgba(40,34,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14151a; --stage: #1b1d23; --ink: #e9e6dd; --muted: #8d8a80;
      --rule: #2c2f36; --panel: #1e2027; --brass: #d3a05a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14151a; --stage: #1b1d23; --ink: #e9e6dd; --muted: #8d8a80;
    --rule: #2c2f36; --panel: #1e2027; --brass: #d3a05a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    padding-block: 6px; padding-inline: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .vehicle { font-size: 12px; color: var(--muted); }
  .vehicle b { color: var(--ink); font-weight: 500; }

  /* One page for every version: the switch sits in the header, before the vehicle line, so which
     van you are looking at is the first thing you read. Hidden when there is only one. */
  .versions { display: flex; gap: 0; align-self: center; }
  .versions[hidden] { display: none; }
  .versions button {
    font-family: Archivo, system-ui, sans-serif; font-weight: 700; font-size: 12px;
    padding: 2px 10px; border-radius: 0; margin-left: -1px;
  }
  .versions button:first-child { border-radius: 2px 0 0 2px; margin-left: 0; }
  .versions button:last-child { border-radius: 0 2px 2px 0; }
  .versions button[aria-pressed="true"] {
    background: var(--brass); border-color: var(--brass); color: var(--paper);
    position: relative;
  }

  main { position: relative; min-height: 0; background: var(--stage); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start;
    pointer-events: none;
  }
  .group {
    pointer-events: auto; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 3px; box-shadow: var(--shadow); padding: 3px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px; max-width: 100%;
  }
  /* the group name sits in the row, before its buttons, rather than on a line of its own */
  .group > .lbl {
    font-family: Archivo, sans-serif; font-weight: 500; font-size: 8.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 3px;
  }
  button {
    font: inherit; font-size: 11px; color: var(--ink); cursor: pointer;
    background: transparent; border: 1px solid var(--rule); border-radius: 2px;
    padding: 2px 7px; transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--stage); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  button.off { opacity: .45; text-decoration: line-through; }

  /* Both of these float over the 3D canvas, whose colour is whatever the model happens to
     show there - white bodywork one moment, empty dark stage the next. Text alone was
     unreadable against half of it, so each chip carries its own ground. */
  .readout {
    position: absolute; left: 16px; bottom: 14px; right: 16px;
    display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
  }
  .readout span {
    white-space: nowrap; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 2px; padding: 2px 7px;
    box-shadow: var(--shadow);
  }
  .readout b { color: var(--brass); font-weight: 500; }

  .labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .tag {
    position: absolute; transform: translate(-50%, -50%); padding: 2px 6px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 2px;
    box-shadow: var(--shadow); font-size: 10.5px; line-height: 1.35; white-space: nowrap;
  }
  .tag b { display: block; font-weight: 500; }
  .tag i {
    font-style: normal; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9.5px; color: var(--muted);
  }

  @media (max-width: 720px) {
    .panel { top: 6px; left: 6px; right: 6px; gap: 4px; }
    .group { padding: 3px; gap: 2px; border-radius: 2px; }
    .group > .lbl { display: none; }
    button { font-size: 10.5px; padding: 2px 5px; }
    .readout { bottom: 8px; left: 8px; right: 8px; font-size: 9.5px; gap: 3px; }
    .tag { font-size: 9px; padding: 1px 4px; }
    .tag i { font-size: 8px; }
  }
  @media (max-width: 420px) {
    button { font-size: 10px; padding: 2px 4px; }
  }
</style>

<div id="app">
  <header>
    <div class="versions" id="versions" role="group" aria-label="Layout version" hidden></div>
    <span class="vehicle" id="vehicle"></span>
  </header>
  <main>
    <canvas id="c"></canvas>
    <div class="labels" id="labels"></div>
    <div class="panel">
      <div class="group" id="views"><span class="lbl">View</span></div>
      <div class="group" id="layers"><span class="lbl">Show</span></div>
    </div>
    <div class="readout" id="readout"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  // Every variant in one page. Each one's geometry is its own; the prop meshes are shared,
  // because v1, v2 and v3 use many of the same appliances and a glb is the heavy part.
  var BUNDLE = /*MODEL_DATA*/null;
  var ORDER = BUNDLE.order, current = null;

  function pick() {
    var h = (location.hash || "").replace("#", "");
    if (BUNDLE.variants[h]) { return h; }
    try {
      var s = localStorage.getItem("van-viewer-variant");
      if (BUNDLE.variants[s]) { return s; }
    } catch (e) {}
    return BUNDLE.start || ORDER[ORDER.length - 1];
  }

  var versionsEl = document.getElementById("versions");
  versionsEl.hidden = ORDER.length < 2;
  ORDER.forEach(function (id) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = id; b.id = "variant-" + id;
    b.title = BUNDLE.variants[id].title;
    b.addEventListener("click", function () { show(id); });
    versionsEl.appendChild(b);
  });

  function show(id) {
    // what you were looking at comes with you: the same view, the same layers switched on,
    // so v2 and v3 can be compared from one spot rather than set up again each time
    var keep = current ? current.state() : null;
    if (current) { current.dispose(); }
    current = build(BUNDLE.variants[id], keep);
    ORDER.forEach(function (o) {
      document.getElementById("variant-" + o).setAttribute("aria-pressed", String(o === id));
    });
    try { localStorage.setItem("van-viewer-variant", id); } catch (e) {}
    if (history.replaceState) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
  }

  window.addEventListener("resize", function () { if (current) { current.resize(); } });
  var glbCache = {};

  function build(MODEL, keep) {
  var alive = true;
  var mm = 0.001;
  var L = MODEL.length * mm, W = MODEL.width * mm, H = MODEL.height * mm;
  var NOSE = (MODEL.nose || 0) * mm;

  document.getElementById("vehicle").innerHTML = "<b>" + (BUNDLE.vehicle || "") + "</b> (Interior " +
    MODEL.length + " × " + MODEL.width + " × " + MODEL.height + " mm)";
  var readout = document.getElementById("readout");
  readout.textContent = "";
  (MODEL.stats || []).forEach(function (t) {
    var parts = t.split(" ");
    var num = parts.find(function (p) { return /^\d+$/.test(p); });
    var el = document.createElement("span");
    el.innerHTML = num ? t.replace(num, "<b>" + num + "</b>") : t;
    readout.appendChild(el);
  });

  var NAMES = MODEL.names || {};
  var APPLIANCES = MODEL.appliances || [];
  var isAppliance = {};
  APPLIANCES.forEach(function (k) { isAppliance[k] = 1; });
  // walls and roof render back-faces only, so the body reads as an enclosure from inside
  // and never blocks the view from outside
  var CUTAWAY = { shell: 1, cab: 1 };

  // A variant can send its own Show buttons - v2 groups different things from v1. Without
  // one, this is the list.
  var LAYERS = MODEL.layers || [
    { id: "bed", label: "Bed made up", kinds: ["infill"], on: false, hide: ["table", "leg"] },
    { id: "cubicle", label: "Wet cubicle", kinds: ["WET CUBICLE", "step"], on: true },
    { id: "lockers", label: "Lockers", kinds: ["overhead"], on: true },
    { id: "kit", label: "Appliances", kinds: APPLIANCES, on: true, xray: true },
    { id: "body", label: "Body + glass",
      kinds: ["shell", "glass", "floor", "wheel", "partition", "hatch"], on: true },
    { id: "cab", label: "Cab + seats", kinds: ["cab", "seat", "dash"], on: true },
    { id: "props", label: "Detailed props", kinds: [], on: true, props: true },
    { id: "schema", label: "Schema overlay", kinds: [], on: false, schema: true },
    { id: "sizes", label: "Sizes", kinds: [], on: false, sizes: true }
  ];
  var VIEWS = [
    { id: "inside", label: "Inside", theta: 0.04, phi: 1.52, r: 3.4 },
    { id: "door", label: "From the door", theta: -1.60, phi: 1.46, r: 4.2 },
    { id: "over", label: "Overview", theta: -0.95, phi: 1.00, r: 8.2 },
    { id: "top", label: "From above", theta: -0.95, phi: 0.20, r: 7.0 },
    // straight down, nose to the left: the plan's own viewpoint, so the schema overlay
    // lands exactly on the drawing it came from
    { id: "plan", label: "Plan", theta: 1.5708, phi: 0.08, r: Math.max(2.6, L * 1.05),
      schema: true }
  ];

  // a fresh canvas per variant: its listeners and its GL context go with the old one
  var old = document.getElementById("c"), canvas = document.createElement("canvas");
  canvas.id = "c";
  old.parentNode.replaceChild(canvas, old);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, 1, 0.05, 200);
  var target = new THREE.Vector3(L / 2, H / 2.4, W / 2);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a917f, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.5);
  sun.position.set(-3, 6, 4);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xffffff, 0.25);
  fill.position.set(4, 2, -3);
  scene.add(fill);

  var groups = {};
  function groupFor(kind) {
    if (!groups[kind]) { groups[kind] = new THREE.Group(); scene.add(groups[kind]); }
    return groups[kind];
  }

  var glassy = {}, round = {};
  (MODEL.glassy || []).forEach(function (k) { glassy[k] = 1; });
  (MODEL.cylinders || []).forEach(function (k) { round[k] = 1; });

  // Carcasses that have kit inside them. Showing the appliances ghosts these, so you can see
  // into a bench or the galley without inventing door and drawer splits we have not designed.
  var container = {};
  (MODEL.containers || []).forEach(function (k) { container[k] = 1; });
  var ghostBody = [], ghostEdge = [];
  function setGhost(on) {
    ghostBody.forEach(function (m) {
      m.transparent = on; m.opacity = on ? 0.22 : 1; m.depthWrite = !on; m.needsUpdate = true;
    });
    ghostEdge.forEach(function (m) { m.opacity = on ? 0.85 : 0.5; });
    dirty = true;
  }

  MODEL.boxes.forEach(function (item) {
    var b = item.b;
    var w = (b[1] - b[0]) * mm, d = (b[3] - b[2]) * mm, h = (b[5] - b[4]) * mm;
    if (w <= 0 || d <= 0 || h <= 0) return;
    var geo;
    if (round[item.k]) {                             // road wheels, axle across the van
      geo = new THREE.CylinderGeometry(Math.min(w, h) / 2, Math.min(w, h) / 2, d, 28);
      geo.rotateX(Math.PI / 2);
    } else {
      geo = new THREE.BoxGeometry(w, h, d);
    }
    var opts = { color: new THREE.Color(MODEL.colours[item.k] || "#dddddd") };
    if (glassy[item.k]) {
      opts.transparent = true; opts.opacity = 0.3; opts.side = THREE.DoubleSide;
      opts.depthWrite = false;
    } else if (CUTAWAY[item.k]) {
      opts.side = THREE.BackSide;
    }
    var mat = new THREE.MeshLambertMaterial(opts);
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((b[0] * mm) + w / 2, (b[4] * mm) + h / 2, (b[2] * mm) + d / 2);
    groupFor(item.k).add(mesh);
    if (container[item.k]) { ghostBody.push(mat); }
    if (!glassy[item.k] && !CUTAWAY[item.k] && !round[item.k]) {   // furniture, not the body
      var line = new THREE.LineBasicMaterial({ color: 0x6b6b66, transparent: true, opacity: 0.5 });
      var edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), line);
      edges.position.copy(mesh.position);
      groupFor(item.k).add(edges);
      if (container[item.k]) { ghostEdge.push(line); }
    }
  });

  // Cables and pipes (systems.py): tubes along their routes, drawn thicker than life so they
  // read. Each run is a polyline; zero-length steps are dropped.
  (MODEL.runs || []).forEach(function (run) {
    var pts = [];
    run.pts.forEach(function (q) {
      var v = new THREE.Vector3(q[0] * mm, q[2] * mm, q[1] * mm);
      if (!pts.length || pts[pts.length - 1].distanceTo(v) > 1e-4) { pts.push(v); }
    });
    if (pts.length < 2) { return; }
    var path = new THREE.CurvePath();
    for (var i = 1; i < pts.length; i++) { path.add(new THREE.LineCurve3(pts[i - 1], pts[i])); }
    var geo = new THREE.TubeGeometry(path, 8 * (pts.length - 1), run.r * mm, 6, false);
    var mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(MODEL.colours[run.k] || "#c0392b") });
    groupFor(run.k).add(new THREE.Mesh(geo, mat));
  });

  // Detailed prop meshes, made by props.py and embedded as glb. The box stays the authority:
  // each mesh is scaled to exactly fill its box, so a generated shape can never quietly move a
  // dimension. Turning the layer on swaps the coloured box for the mesh.
  // A variant can map a kind to its own mesh (propmap): v2-real's battery is a real Ective,
  // v2's stays the generic one. The glb cache is keyed by the mesh, not the kind.
  var PROPS = {};
  (MODEL.props || []).forEach(function (k) {
    var key = (MODEL.propmap || {})[k] || k;
    if (BUNDLE.props[key]) { PROPS[k] = Object.assign({ key: key }, BUNDLE.props[key]); }
  });
  var propParts = {}, propsOn = false;

  function b64buf(k, s) {
    if (glbCache[k]) { return glbCache[k].slice(0); }   // parse may keep the one it is given
    var bin = atob(s), buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { buf[i] = bin.charCodeAt(i); }
    glbCache[k] = buf.buffer;
    return buf.buffer.slice(0);
  }

  function loadProps() {
    if (!THREE.GLTFLoader) { return; }
    var loader = new THREE.GLTFLoader();
    MODEL.boxes.forEach(function (item) {
      var p = PROPS[item.k];
      if (!p) { return; }
      loader.parse(b64buf(p.key, p.glb), "", function (g) {
        if (!alive) { return; }                      // switched away before it arrived
        var o = g.scene, b = item.b;
        o.rotation.y = ((p.yaw || 0) + (item.y || 0)) * Math.PI / 180;
        o.updateMatrixWorld(true);
        var bb = new THREE.Box3().setFromObject(o);
        var size = bb.getSize(new THREE.Vector3());
        o.position.sub(bb.getCenter(new THREE.Vector3()));
        o.traverse(function (n) {
          if (n.isMesh) {
            // decimating strips the normals, and a mesh without them lights as pure black
            if (!n.geometry.attributes.normal) { n.geometry.computeVertexNormals(); }
            // meshes built from datasheets (solids.py) carry their own colours
            n.material = new THREE.MeshLambertMaterial({ color: p.own && n.material.color ?
              n.material.color.clone() : new THREE.Color(MODEL.colours[item.k] || "#cccccc") });
          }
        });
        var w = (b[1] - b[0]) * mm, d = (b[3] - b[2]) * mm, h = (b[5] - b[4]) * mm;
        var wrap = new THREE.Group();
        wrap.add(o);
        // Fill the box by default: the box is the real reserved space, and a mesh fitted
        // uniformly shrinks to whatever its worst axis allows - a 70 mm bed cushion pulled a
        // whole mattress down to a quarter of its slot. Props whose box is only a space
        // reservation keep their proportions instead; model3d.KEEP_SHAPE lists them.
        var sx = w / (size.x || 1), sy = h / (size.y || 1), sz = d / (size.z || 1);
        if (p.fit === "keep") { sx = sy = sz = Math.min(sx, sy, sz); }
        // "real": built in mm at the product's true size, smaller than its slot - drawn 1:1,
        // standing on the slot's floor, centred in plan
        var lift = h / 2;
        if (p.fit === "real") { sx = sy = sz = mm; lift = size.y * mm / 2; }
        wrap.scale.set(sx, sy, sz);
        wrap.position.set(b[0] * mm + w / 2, b[4] * mm + lift, b[2] * mm + d / 2);
        wrap.visible = propsOn;
        scene.add(wrap);
        (propParts[item.k] = propParts[item.k] || []).push(wrap);
        refresh();                                   // the mesh arrives long after the boxes
      }, function (e) { console.warn("prop " + item.k + " failed to parse", e); });
    });
  }
  loadProps();

  // What each layer wants shown, by kind. Kinds on no layer are always shown. The box and its
  // mesh must never both be drawn, and turning a layer back on must not resurrect a box whose
  // mesh is showing - so visibility is worked out in one place rather than by each toggle.
  var kindWanted = {};
  function refresh() {
    Object.keys(groups).forEach(function (k) {
      groups[k].visible = kindWanted[k] !== false && !(propsOn && propParts[k]);
    });
    Object.keys(propParts).forEach(function (k) {
      propParts[k].forEach(function (g) { g.visible = propsOn && kindWanted[k] !== false; });
    });
    dirty = true;
  }

  function setProps(on) {
    propsOn = on;
    refresh();
  }

  // Schema overlay: the plan drawing itself, laid on the floor of the model. plan.py
  // renders it cropped to exactly the load box and model3d embeds it, so this is the same
  // picture as layout.png - not a redrawing of it - and it lands 1:1 on the floor.
  var PLAN = MODEL.plan, schema = null;

  function buildSchema(then) {
    if (schema || !PLAN || !PLAN.img) { if (then) then(); return; }
    var geo = new THREE.PlaneGeometry(L, W);
    geo.rotateX(-Math.PI / 2);                     // lie flat, image top = passenger wall
    var tex = new THREE.TextureLoader().load(PLAN.img, function () {
      if (renderer.capabilities.getMaxAnisotropy) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }
      dirty = true;
      if (then) { then(); }
    });
    // Painted over the model rather than buried under it: on the floor with a depth test
    // the furniture hides the very thing you switched on, and from above - the one angle
    // where a plan is worth reading - you would see nothing but the bed.
    schema = new THREE.Mesh(geo, new THREE.MeshBasicMaterial(
      { map: tex, transparent: true, opacity: 0.94, depthWrite: false, depthTest: false }));
    schema.position.set(L / 2, 0.005, W / 2);      // floor level, so it lines up in 3D too
    schema.renderOrder = 999;
    scene.add(schema);
  }

  function setSchema(on) {
    if (on) { buildSchema(); }
    if (schema) { schema.visible = on; }
    dirty = true;
  }

  var startView = VIEWS[1];                         // from the door: the view you walk in to
  VIEWS.forEach(function (v) { if (keep && v.id === keep.view) { startView = v; } });
  var viewNow = startView.id;
  var theta = startView.theta, phi = startView.phi, radius = startView.r, dirty = true;
  var home = target.clone();
  var applyLayer = {};                             // id -> the layer's own apply(), filled below

  function place() {
    phi = Math.max(0.08, Math.min(Math.PI - 0.08, phi));
    radius = Math.max(0.8, Math.min(30, radius));
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.cos(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);
    camera.updateMatrixWorld();                    // pan reads its axes straight off this
    dirty = true;
  }

  // Orbiting alone cannot look at a corner: the camera always points at the middle of the
  // van, so the galley ends up at the edge of the frame and zooming in only pushes it out.
  // Panning moves what the camera looks at, across the screen, so anything can be centred.
  // Right or middle drag, shift-drag, and two fingers all do it - whichever the hand reaches
  // for first.
  var RIGHT = new THREE.Vector3(), UP = new THREE.Vector3(), FWD = new THREE.Vector3();
  function panBy(dx, dy) {
    camera.matrixWorld.extractBasis(RIGHT, UP, FWD);
    var f = radius * 0.0016;                       // a drag tracks the cursor at any zoom
    target.addScaledVector(RIGHT, -dx * f);
    target.addScaledVector(UP, dy * f);
    place();
  }

  var pts = {}, lastMid = null, lastSpan = 0;
  var panning = function (e) {
    return e.button === 1 || e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey;
  };
  function mid() {
    var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
             d: Math.hypot(a.x - b.x, a.y - b.y) };
  }

  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY, pan: panning(e) };
    if (Object.keys(pts).length === 2) { var m = mid(); lastMid = m; lastSpan = m.d; }
  });
  canvas.addEventListener("pointermove", function (e) {
    var p = pts[e.pointerId];
    if (!p) { return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    var n = Object.keys(pts).length;
    if (n >= 2) {                                  // two fingers: pan, and pinch to zoom
      var m = mid();
      if (lastMid) {
        panBy(m.x - lastMid.x, m.y - lastMid.y);
        if (lastSpan > 0 && m.d > 0) { radius *= lastSpan / m.d; place(); }
      }
      lastMid = m; lastSpan = m.d;
      return;
    }
    if (p.pan || e.shiftKey || e.ctrlKey || e.metaKey) {
      panBy(dx, dy);
      return;
    }
    theta -= dx * 0.007;
    phi -= dy * 0.007;
    place();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
    canvas.addEventListener(t, function (e) {
      delete pts[e.pointerId];
      if (Object.keys(pts).length < 2) { lastMid = null; lastSpan = 0; }
    });
  });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault(); radius *= (1 + Math.sign(e.deltaY) * 0.1); place();
  }, { passive: false });

  var viewsEl = document.getElementById("views");
  viewsEl.querySelectorAll("button").forEach(function (b) { b.remove(); });
  VIEWS.forEach(function (v, i) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = v.label; b.id = "view-" + v.id;
    b.setAttribute("aria-pressed", String(v === startView));
    b.addEventListener("click", function () {
      viewNow = v.id;
      theta = v.theta; phi = v.phi; radius = v.r;
      target.copy(home);                           // a view is a view, panning and all
      place();
      VIEWS.forEach(function (o) {
        document.getElementById("view-" + o.id).setAttribute("aria-pressed", String(o === v));
      });
      // the plan view is the plan: it brings the drawing with it rather than leaving you to
      // find the switch for it
      if (v.schema && applyLayer.schema) { applyLayer.schema(true); }
    });
    viewsEl.appendChild(b);
  });

  var showSizes = false;
  var layersEl = document.getElementById("layers");
  layersEl.querySelectorAll("button").forEach(function (b) { b.remove(); });
  LAYERS.forEach(function (layer) {
    if (keep && layer.id in keep.layers) { layer.on = keep.layers[layer.id]; }
    var b = document.createElement("button");
    b.type = "button"; b.textContent = layer.label; b.id = "layer-" + layer.id;
    function apply() {
      b.classList.toggle("off", !layer.on);
      layer.kinds.forEach(function (k) { kindWanted[k] = layer.on; });
      (layer.hide || []).forEach(function (k) { kindWanted[k] = !layer.on; });
      refresh();
      if (layer.props) setProps(layer.on);
      if (layer.sizes) showSizes = layer.on;
      if (layer.schema) setSchema(layer.on);
      if (layer.xray) setGhost(layer.on);
      dirty = true;
    }
    b.addEventListener("click", function () { layer.on = !layer.on; apply(); });
    applyLayer[layer.id] = function (on) { layer.on = on; apply(); };
    layersEl.appendChild(b);
    apply();                                           // layers that start off start off
  });

  // Dimension tags: one per named box, HTML projected onto the canvas each frame. Cheaper
  // and far more legible than text sprites, and it picks up the page's own typography.
  var labelsEl = document.getElementById("labels"), tags = [];
  labelsEl.textContent = "";
  MODEL.boxes.forEach(function (item) {
    var name = NAMES[item.k], b = item.b;
    if (!name) return;
    var el = document.createElement("div");
    el.className = "tag";
    el.innerHTML = "<b>" + name + "</b><i>" +
      (b[1] - b[0]) + " × " + (b[3] - b[2]) + " × " + (b[5] - b[4]) + " mm</i>";
    el.style.display = "none";
    labelsEl.appendChild(el);
    tags.push({ el: el, k: item.k, p: new THREE.Vector3(
      (b[0] + b[1]) / 2 * mm, (b[4] + b[5]) / 2 * mm, (b[2] + b[3]) / 2 * mm) });
  });

  // Thirty tags at box centres pile into mush, so nearest wins: sort front to back and drop
  // any tag whose rectangle lands on one already placed. Orbit slightly and the hidden ones
  // come back. Labels follow their own layer, so switching a layer off takes its tags with it.
  function drawLabels() {
    var r = canvas.getBoundingClientRect(), p = new THREE.Vector3(), live = [];
    tags.forEach(function (t) {
      var g = groups[t.k];
      p.copy(t.p).project(camera);
      if (!showSizes || (g && !g.visible) ||
          p.z > 1 || Math.abs(p.x) > 1.1 || Math.abs(p.y) > 1.1) {
        t.el.style.display = "none";
        return;
      }
      t.el.style.display = "block";
      t.el.style.visibility = "hidden";               // measurable, not yet painted
      t.el.style.left = ((p.x + 1) / 2 * r.width) + "px";
      t.el.style.top = ((1 - p.y) / 2 * r.height) + "px";
      if (!t.w) { t.w = t.el.offsetWidth; t.h = t.el.offsetHeight; }
      live.push({ t: t, d: p.z,
                  x: (p.x + 1) / 2 * r.width, y: (1 - p.y) / 2 * r.height });
    });
    live.sort(function (a, b) { return a.d - b.d; });
    var placed = [];
    live.forEach(function (v) {
      var b = [v.x - v.t.w / 2, v.y - v.t.h / 2, v.x + v.t.w / 2, v.y + v.t.h / 2];
      var clash = placed.some(function (q) {
        return b[0] < q[2] + 4 && b[2] > q[0] - 4 && b[1] < q[3] + 3 && b[3] > q[1] - 3;
      });
      if (clash) { v.t.el.style.display = "none"; return; }
      placed.push(b);
      v.t.el.style.visibility = "visible";
    });
  }

  function resize() {
    var r = canvas.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(1, r.height);
    camera.updateProjectionMatrix();
    dirty = true;
  }
  resize(); place();

  (function loop() {
    if (!alive) return;
    requestAnimationFrame(loop);
    if (!dirty) return;
    dirty = false;
    renderer.render(scene, camera);
    drawLabels();
  })();

  return {
    resize: resize,
    state: function () {
      var on = {};
      LAYERS.forEach(function (l) { on[l.id] = l.on; });
      return { view: viewNow, layers: on };
    },
    dispose: function () {
      alive = false;
      scene.traverse(function (n) {
        if (n.geometry) { n.geometry.dispose(); }
        if (n.material) {
          (Array.isArray(n.material) ? n.material : [n.material]).forEach(function (m) {
            if (m.map) { m.map.dispose(); }
            m.dispose();
          });
        }
      });
      renderer.dispose();
      if (renderer.forceContextLoss) { renderer.forceContextLoss(); }
    }
  };
  }

  show(pick());
})();
</script>
